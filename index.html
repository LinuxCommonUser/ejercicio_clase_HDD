<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Formulario de Postulación de Ayuda</h2>

    <form action="#" method="post">
        <p>
            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre">
        </p>
        <p>
            <label for="dni">DNI:</label><br>
            <input type="text" id="dni" name="dni" maxlength="8">
        </p>
        <p>
            <label for="telefono">Teléfono / Celular:</label><br>
            <input type="tel" id="telefono" name="telefono">
        </p>
        <p>
            <label for="alergias">¿Tiene alergia a algún animal? (Especifique o coloque "Ninguna"):</label><br>
            <input type="text" id="alergias" name="alergias">
        </p>
        <p>
            <label for="direccion">¿Dónde vive? (Distrito / Dirección):</label><br>
            <input type="text" id="direccion" name="direccion">
        </p>
        <p>
            <label for="horarios">Horarios y días disponibles:</label><br>
            <textarea id="horarios" name="horarios" rows="3" cols="30" placeholder="Ej: Fines de semana por la mañana"></textarea>
        </p>
        <p>
            <button type="submit">Enviar</button>
        </p>
</body>
</html>
